[project]
name = "mapa-server"
version = "0.1.0"
description = "Mapa backend: API, scheduler and voice agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "livekit-api>=1.0",
  "livekit-agents>=1.8",
  "livekit-plugins-google>=1.8",
  "livekit-plugins-sarvam>=1.8",
  "livekit-plugins-silero>=1.8",
  "google-auth>=2.30",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "sqlglot>=25", "pgserver>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mapa_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
