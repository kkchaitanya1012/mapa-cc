<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Inter,sans-serif;background:#FBF9FF;color:#2B2440;position:relative;padding:16px 18px}
.status{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:0 10px}
h1{font-size:30px;font-weight:800;margin:24px 4px 4px;letter-spacing:-.02em}
small{font-size:14px;color:#6B6383;margin-left:4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.card{border-radius:24px;padding:14px;border:3px solid #fff;box-shadow:0 0 0 1.5px #2B2440 inset;text-align:center}
.face{width:88px;height:88px;border-radius:50%;margin:6px auto 10px;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;border:2px solid #2B2440}
.card b{display:block;font-size:17px}
.card p{font-size:12.5px;color:#6B6383;margin-top:3px}
.ribbon{margin-top:10px;font-size:12px;font-weight:700;padding:6px 0;border-radius:99px;color:#fff}
.sec{font-size:18px;font-weight:700;margin:24px 4px 12px}
.row{background:#fff;border-radius:18px;padding:13px 15px;display:flex;justify-content:space-between;margin-bottom:9px;border:1.5px solid #2B2440}
.row b{font-size:15px}.row span{font-size:13px;font-weight:700;color:#7C5CFF}
.fab{position:absolute;right:22px;bottom:34px;width:64px;height:64px;border-radius:50%;background:#7C5CFF;color:#fff;font-size:34px;display:grid;place-items:center;border:3px solid #2B2440}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<h1>Your people</h1><small>Tue, 27 Oct</small>
<div class="cards">
  <div class="card" style="background:#FFF1F4"><div class="face">A</div><b>Amma</b><p>loves filter coffee</p><div class="ribbon" style="background:#F06A9B">9:00 taken ✓</div></div>
  <div class="card" style="background:#E9F6EE"><div class="face">N</div><b>Nanna</b><p>morning walker</p><div class="ribbon" style="background:#4CC38A">1:30 up next</div></div>
</div>
<div class="sec">Calls today</div>
<div class="row"><b>9:00 · Amma · BP tablet</b><span>Taken</span></div>
<div class="row"><b>1:30 · Nanna · Metformin</b><span>Next</span></div>
<div class="row"><b>8:00 · Amma · Vitamin D</b><span>Later</span></div>
<div class="fab">+</div>
</body></html>
