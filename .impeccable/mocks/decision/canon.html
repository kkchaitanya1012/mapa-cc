<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Inter,sans-serif;background:#fff;color:#4B4B4B;position:relative;padding:16px 18px}
.status{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:0 10px;color:#111}
.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 4px}
.bar h1{font-size:28px;font-weight:800;color:#111}
.flame{font-size:18px;font-weight:800;color:#FF9600}
.mascot{display:flex;gap:12px;align-items:flex-end;margin:6px 4px 22px}
.blob{width:72px;height:72px;border-radius:50% 50% 44% 44%;background:#58CC02;position:relative;flex:none}
.blob:before,.blob:after{content:"";position:absolute;top:24px;width:12px;height:14px;background:#fff;border-radius:50%}
.blob:before{left:18px}.blob:after{right:18px}
.bubble{border:2px solid #E5E5E5;border-radius:18px;padding:12px 14px;font-size:15px;font-weight:600;color:#3C3C3C}
.card{border:2px solid #E5E5E5;border-bottom-width:4px;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card b{font-size:16px;color:#3C3C3C;display:block}.card p{font-size:13.5px;margin-top:2px}
.ok{color:#58CC02;font-weight:800}
.btn{position:absolute;left:18px;right:18px;bottom:34px;background:#58CC02;color:#fff;text-align:center;font-weight:800;font-size:16px;padding:16px;border-radius:16px;box-shadow:0 4px 0 #46A302;letter-spacing:.04em}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div class="bar"><h1>Today</h1><span class="flame">🔥 12</span></div>
<div class="mascot"><div class="blob"></div><div class="bubble">Amma took her BP tablet! Nanna's call is at 1:30.</div></div>
<div class="card"><div><b>Amma · BP tablet</b><p>9:00 am</p></div><span class="ok">✓</span></div>
<div class="card"><div><b>Nanna · Metformin</b><p>1:30 pm</p></div><span style="color:#1CB0F6;font-weight:800">NEXT</span></div>
<div class="card"><div><b>Amma · Vitamin D</b><p>8:00 pm</p></div><span>—</span></div>
<div class="btn">ADD A REMINDER</div>
</body></html>
