<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Inter,sans-serif;background:#F3F8F1;color:#22301F;position:relative}
.status{display:flex;justify-content:space-between;padding:16px 28px 0;font-size:15px;font-weight:600}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:18px 22px 2px}
small{display:block;font-size:14px;color:#5D6E58;margin-left:22px}
.plants{display:flex;gap:12px;margin:18px 14px 0}
.pl{flex:1;background:#fff;border-radius:24px;padding:14px;text-align:center}
.pl svg{width:100%;height:120px}
.pl b{font-size:15px;display:block;margin-top:4px}.pl p{font-size:12px;color:#5D6E58}
.sec{font-size:18px;font-weight:700;margin:22px 22px 10px}
.row{margin:0 18px 10px;background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.row b{font-size:15.5px;display:block}.row p{font-size:13px;color:#5D6E58;margin-top:2px}
.pill{margin-left:auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px}
.fab{position:absolute;right:22px;bottom:34px;width:64px;height:64px;border-radius:50%;background:#3E8E5A;color:#fff;font-size:34px;display:grid;place-items:center}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<h1>Today</h1><small>Tue, 27 Oct</small>
<div class="plants">
  <div class="pl"><svg viewBox="0 0 100 120"><path d="M50 118 V40" stroke="#3E8E5A" stroke-width="4"/><ellipse cx="34" cy="70" rx="16" ry="8" fill="#3E8E5A" transform="rotate(-30 34 70)"/><ellipse cx="66" cy="56" rx="16" ry="8" fill="#3E8E5A" transform="rotate(30 66 56)"/><circle cx="50" cy="32" r="12" fill="#E5484D"/></svg><b>Amma</b><p>day 12 · flowering</p></div>
  <div class="pl"><svg viewBox="0 0 100 120"><path d="M50 118 V70" stroke="#3E8E5A" stroke-width="4"/><ellipse cx="38" cy="80" rx="12" ry="6" fill="#3E8E5A" transform="rotate(-30 38 80)"/><ellipse cx="62" cy="72" rx="12" ry="6" fill="#B7C9B0" transform="rotate(30 62 72)"/></svg><b>Nanna</b><p>day 5 · sprouting</p></div>
</div>
<div class="sec">Calls today</div>
<div class="row"><div><b>Amma · BP tablet</b><p>9:00 am</p></div><span class="pill" style="background:#DCEFD9">Taken</span></div>

<div class="fab">+</div>
</body></html>
