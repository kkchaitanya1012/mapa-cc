<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Inter,sans-serif;background:#FBF4EC;color:#2A1A16;position:relative}
.head{background:#B5482F;color:#FBF4EC;padding:16px 22px 26px;border-radius:0 0 32px 32px}
.status{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:0 6px}
h1{font-size:30px;font-weight:800;margin-top:22px;letter-spacing:-.02em}
small{font-size:14px;opacity:.8}
.grid{margin:22px auto 0;width:240px;height:150px;position:relative}
.grid svg{width:100%;height:100%}
.wk{display:flex;justify-content:space-between;width:240px;margin:10px auto 0;font-size:12px;font-weight:600;opacity:.85}
.list{padding:22px 18px}
.sec{font-size:18px;font-weight:700;margin:0 4px 12px}
.row{background:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:10px;border:1px solid #F0E3D6}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.row b{font-size:16px;display:block}.row p{font-size:13.5px;color:#7A5E54;margin-top:2px}
.pill{margin-left:auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px}
.fab{position:absolute;right:22px;bottom:34px;width:64px;height:64px;border-radius:50%;background:#D2304A;color:#fff;font-size:34px;display:grid;place-items:center}
</style></head><body>
<div class="head">
  <div class="status"><span>9:41</span><span>●●● ▮</span></div>
  <h1>Today</h1><small>Amma's muggu · day 12</small>
  <div class="grid"><svg viewBox="0 0 240 150">
    <g fill="#FBF4EC" opacity=".55">
      <circle cx="20" cy="25" r="3"/><circle cx="20" cy="75" r="3"/><circle cx="20" cy="125" r="3"/>
      <circle cx="87" cy="25" r="3"/><circle cx="87" cy="75" r="3"/><circle cx="87" cy="125" r="3"/>
      <circle cx="153" cy="25" r="3"/><circle cx="153" cy="75" r="3"/><circle cx="153" cy="125" r="3"/>
      <circle cx="220" cy="25" r="3"/><circle cx="220" cy="75" r="3"/><circle cx="220" cy="125" r="3"/>
    </g>
    <path d="M20 50 Q53 0 87 50 Q120 100 153 50 Q170 25 186 40" fill="none" stroke="#FBF4EC" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 100 Q53 150 87 100" fill="none" stroke="#F2B632" stroke-width="4" stroke-linecap="round"/>
  </svg></div>
  <div class="wk"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
</div>
<div class="list">
  <div class="sec">Calls today</div>
  <div class="row"><div class="dot" style="background:#D2304A">A</div><div><b>Amma · BP tablet</b><p>9:00 am · taken</p></div><span class="pill" style="background:#F4E7D6">Taken</span></div>
  <div class="row"><div class="dot" style="background:#F2B632">N</div><div><b>Nanna · Metformin</b><p>1:30 pm · with lunch</p></div><span class="pill" style="background:#F2B632">Up next</span></div>
  <div class="row"><div class="dot" style="background:#D2304A">A</div><div><b>Amma · Vitamin D</b><p>8:00 pm</p></div><span class="pill" style="background:#F4E7D6">8:00 pm</span></div>
</div>
<div class="fab">+</div>
</body></html>
