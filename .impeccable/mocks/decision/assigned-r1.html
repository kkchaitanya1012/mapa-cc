<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Inter,sans-serif;background:#F7F7FB;color:#2D2A3E;position:relative}
.status{display:flex;justify-content:space-between;padding:16px 28px 0;font-size:15px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 0}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.top small{display:block;font-size:14px;font-weight:500;color:#6E6A85;margin-top:2px}
.me{width:40px;height:40px;border-radius:50%;background:#2D2A3E;color:#fff;display:grid;place-items:center;font-weight:700}
.next{margin:20px 18px 0;border-radius:28px;background:#BFE8D6;padding:18px 18px 16px;position:relative;overflow:hidden}
.next .k{font-size:12px;font-weight:700;letter-spacing:.06em;color:#1F5C45}
.next .time{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.next .who{font-size:17px;font-weight:700;margin-top:6px}
.next .who span{font-weight:500;color:#2F6B53}
.bubble{position:absolute;right:18px;top:18px;width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 4px 0 rgba(45,42,62,.12)}
.cord{position:absolute;right:42px;top:80px}
.keys{display:flex;gap:8px;margin-top:14px}
.key{flex:1;text-align:center;background:#fff;border-radius:16px;padding:11px 0;font-size:14px;font-weight:700;box-shadow:0 4px 0 rgba(31,92,69,.25)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 22px 10px}
.sec h2{font-size:18px;font-weight:700}.sec a{font-size:14px;font-weight:600;color:#6E6A85}
.log{margin:0 18px;background:#fff;border-radius:24px;padding:4px 0;box-shadow:0 8px 24px rgba(45,42,62,.06)}
.row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid #EFEEF5}
.row:last-child{border:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.row b{font-size:15.5px;display:block}.row p{font-size:13px;color:#6E6A85;margin-top:2px}
.row q{display:block;font-size:13px;margin-top:5px;font-style:normal;color:#2D2A3E}
.t{margin-left:auto;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.t i{display:block;font-style:normal;font-size:11.5px;font-weight:600;margin-top:3px}
.fab{position:absolute;right:22px;bottom:34px;width:64px;height:64px;border-radius:50%;background:#2D2A3E;color:#fff;font-size:34px;font-weight:300;display:grid;place-items:center;box-shadow:0 6px 0 #000,0 14px 30px rgba(45,42,62,.25)}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div class="top"><div><h1>Today</h1><small>Tue, 27 Oct</small></div><div class="me">M</div></div>
<div class="next">
  <div class="k">MAPA CALLS NEXT</div>
  <div class="time">1:30<span style="font-size:24px"> pm</span></div>
  <div class="who">Nanna <span>· Metformin 500 mg</span></div>
  <div class="bubble">N</div>
  <svg class="cord" width="40" height="60" viewBox="0 0 40 60"><path d="M20 0 c12 4 12 10 0 12 c-12 2 -12 8 0 12 c12 4 12 10 0 12 c-12 2 -12 8 0 12 c8 3 10 6 10 12" fill="none" stroke="#2D2A3E" stroke-width="2.5" stroke-linecap="round"/></svg>
  <div class="keys"><div class="key">Call now</div><div class="key">Snooze</div></div>
</div>
<div class="sec"><h2>Call log</h2><a>All</a></div>
<div class="log">
  <div class="row"><div class="av" style="background:#FFC9B0">A</div><div><b>Amma · BP tablet</b><p>Answered · 1 min 12 s</p><q>“Took it with idli, feeling good!”</q></div><div class="t">9:00 am<i style="color:#1F8A55">Taken</i></div></div>
  <div class="row"><div class="av" style="background:#BFE8D6">N</div><div><b>Nanna · Metformin</b><p>With lunch</p></div><div class="t">1:30 pm<i style="color:#1F5C45">Up next</i></div></div>
  <div class="row"><div class="av" style="background:#FFC9B0">A</div><div><b>Amma · Vitamin D</b><p>1 capsule</p></div><div class="t">8:00 pm<i style="color:#6E6A85">Later</i></div></div>
</div>
<div class="fab">+</div>
</body></html>
