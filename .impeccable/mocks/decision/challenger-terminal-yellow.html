<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Inter,sans-serif;background:#F4F2EC;color:#141414;position:relative}
.status{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:16px 28px}
h1{font-size:30px;font-weight:800;margin:10px 22px 16px;letter-spacing:-.02em}
.band{background:#FFD400;margin:0 14px;border-radius:18px;padding:18px 20px}
.band small{font-size:12px;font-weight:700;letter-spacing:.06em}
.band .t{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:6px}
.band .w{font-size:18px;font-weight:700;margin-top:6px}
.band .c{display:inline-block;margin-top:12px;background:#141414;color:#FFD400;font-size:13px;font-weight:700;padding:6px 12px;border-radius:8px}
.board{margin:18px 14px;background:#141414;border-radius:18px;padding:6px 0;color:#fff}
.r{display:grid;grid-template-columns:62px 1fr auto;padding:14px 18px;border-bottom:1px solid #2A2A2A;font-size:15px;align-items:center}
.r:last-child{border:0}
.r .tm{font-weight:800;font-variant-numeric:tabular-nums}
.r .st{font-size:12px;font-weight:700;padding:5px 9px;border-radius:6px}
.fab{position:absolute;right:22px;bottom:34px;width:64px;height:64px;border-radius:18px;background:#141414;color:#FFD400;font-size:34px;display:grid;place-items:center}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<h1>Today</h1>
<div class="band"><small>NEXT CALL</small><div class="t">13:30</div><div class="w">Nanna · Metformin 500 mg</div><span class="c">in 3 h 49 min</span></div>
<div class="board">
  <div class="r"><span class="tm">09:00</span><span>Amma · BP tablet</span><span class="st" style="background:#2FB36B">TAKEN</span></div>
  <div class="r"><span class="tm">13:30</span><span>Nanna · Metformin</span><span class="st" style="background:#FFD400;color:#141414">NEXT</span></div>
  <div class="r"><span class="tm">20:00</span><span>Amma · Vitamin D</span><span class="st" style="background:#3A3A3A">LATER</span></div>
</div>
<div class="fab">+</div>
</body></html>
